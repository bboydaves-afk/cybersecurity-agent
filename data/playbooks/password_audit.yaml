# Password and Credential Audit Playbook
name: Password and Credential Audit
description: Comprehensive password policy and credential security audit
version: "1.0"
author: CyberSecurity Agent
trigger: manual

phases:
  - name: Policy Review
    description: Review password policies and configurations
    steps:
      - action: check_password_policy
        description: Review current password policy
      - action: check_cis_benchmark
        description: CIS password-related controls
        params:
          target: "{{ target }}"
          project_id: "{{ project_id }}"

  - name: Credential Discovery
    description: Search for exposed credentials
    steps:
      - action: check_breach_data
        description: Check for breached credentials via HIBP
        params:
          domain: "{{ domain }}"
      - action: check_default_creds
        description: Test for default credentials on services
        params:
          target: "{{ target }}"
      - action: check_credential_reuse
        description: Check for credential reuse across services
        params:
          project_id: "{{ project_id }}"

  - name: Hash Analysis
    description: Analyze discovered password hashes
    condition: "hashes_found"
    steps:
      - action: identify_hash
        description: Identify hash types
        params:
          hash_value: "{{ discovered_hashes }}"
      - action: crack_hash
        description: Generate cracking commands
        params:
          hash_value: "{{ discovered_hashes }}"
          hash_type: auto

  - name: Password Strength
    description: Assess password strength of discovered credentials
    condition: "passwords_found"
    steps:
      - action: analyze_password_strength
        description: Analyze discovered password patterns
        params:
          password: "{{ discovered_passwords }}"

  - name: Spray Testing
    description: Test for weak passwords across the organization
    requires_approval: true
    steps:
      - action: password_spray
        description: Test common passwords against user accounts
        params:
          target: "{{ target }}"
          usernames: "{{ user_list }}"
          password: "{{ spray_password | default('Welcome1!') }}"
        requires_confirmation: true

  - name: Reporting
    description: Generate credential audit report
    steps:
      - action: calculate_risk_score
        params:
          project_id: "{{ project_id }}"
      - action: generate_report
        params:
          project_id: "{{ project_id }}"
          format: html
          title: "Password and Credential Audit — {{ client }}"
