# Security Compliance Frameworks
frameworks:
  cis:
    name: "CIS Controls v8"
    description: "Center for Internet Security Controls"
    total_controls: 18
    categories:
      - id: "CIS-1"
        name: "Inventory and Control of Enterprise Assets"
        checks: ["asset_inventory", "unauthorized_device_detection", "DHCP_logging"]
      - id: "CIS-2"
        name: "Inventory and Control of Software Assets"
        checks: ["software_inventory", "unauthorized_software", "allowlisting"]
      - id: "CIS-3"
        name: "Data Protection"
        checks: ["data_classification", "encryption_at_rest", "encryption_in_transit"]
      - id: "CIS-4"
        name: "Secure Configuration of Enterprise Assets and Software"
        checks: ["hardened_configs", "firewall_enabled", "default_creds_changed"]
      - id: "CIS-5"
        name: "Account Management"
        checks: ["centralized_auth", "MFA", "disable_dormant_accounts", "admin_privilege_review"]
      - id: "CIS-6"
        name: "Access Control Management"
        checks: ["least_privilege", "RBAC", "access_reviews"]
      - id: "CIS-7"
        name: "Continuous Vulnerability Management"
        checks: ["vulnerability_scanning", "patch_management", "remediation_tracking"]
      - id: "CIS-8"
        name: "Audit Log Management"
        checks: ["centralized_logging", "log_retention", "log_review"]
      - id: "CIS-9"
        name: "Email and Web Browser Protections"
        checks: ["email_filtering", "URL_filtering", "browser_hardening"]
      - id: "CIS-10"
        name: "Malware Defenses"
        checks: ["anti_malware", "auto_update", "behavioral_detection"]
      - id: "CIS-11"
        name: "Data Recovery"
        checks: ["backup_schedule", "backup_testing", "offline_backups"]
      - id: "CIS-12"
        name: "Network Infrastructure Management"
        checks: ["network_segmentation", "firewall_rules", "wireless_security"]
      - id: "CIS-13"
        name: "Network Monitoring and Defense"
        checks: ["IDS_IPS", "traffic_monitoring", "DNS_filtering"]
      - id: "CIS-14"
        name: "Security Awareness Training"
        checks: ["phishing_training", "security_policy_awareness"]
      - id: "CIS-15"
        name: "Service Provider Management"
        checks: ["vendor_assessment", "SLA_monitoring"]
      - id: "CIS-16"
        name: "Application Software Security"
        checks: ["secure_SDLC", "code_review", "WAF"]
      - id: "CIS-17"
        name: "Incident Response Management"
        checks: ["IR_plan", "IR_testing", "communication_plan"]
      - id: "CIS-18"
        name: "Penetration Testing"
        checks: ["regular_pentests", "remediation_verification"]

  nist:
    name: "NIST 800-53 Rev 5"
    description: "NIST Security and Privacy Controls"
    families:
      - id: "AC"
        name: "Access Control"
        key_controls: ["AC-2 Account Management", "AC-3 Access Enforcement", "AC-6 Least Privilege", "AC-17 Remote Access"]
      - id: "AU"
        name: "Audit and Accountability"
        key_controls: ["AU-2 Event Logging", "AU-3 Content of Audit Records", "AU-6 Audit Review"]
      - id: "CM"
        name: "Configuration Management"
        key_controls: ["CM-2 Baseline Configuration", "CM-6 Configuration Settings", "CM-7 Least Functionality"]
      - id: "IA"
        name: "Identification and Authentication"
        key_controls: ["IA-2 User Identification", "IA-5 Authenticator Management", "IA-8 Identification (Non-Org Users)"]
      - id: "SC"
        name: "System and Communications Protection"
        key_controls: ["SC-7 Boundary Protection", "SC-8 Transmission Confidentiality", "SC-28 Protection of Information at Rest"]
      - id: "SI"
        name: "System and Information Integrity"
        key_controls: ["SI-2 Flaw Remediation", "SI-3 Malicious Code Protection", "SI-4 System Monitoring"]

  pci_dss:
    name: "PCI-DSS v4.0"
    description: "Payment Card Industry Data Security Standard"
    requirements:
      - id: "Req-1"
        name: "Install and Maintain Network Security Controls"
      - id: "Req-2"
        name: "Apply Secure Configurations to All System Components"
      - id: "Req-3"
        name: "Protect Stored Account Data"
      - id: "Req-4"
        name: "Protect Cardholder Data with Strong Cryptography During Transmission"
      - id: "Req-5"
        name: "Protect All Systems and Networks from Malicious Software"
      - id: "Req-6"
        name: "Develop and Maintain Secure Systems and Software"
      - id: "Req-7"
        name: "Restrict Access to System Components and Cardholder Data by Business Need to Know"
      - id: "Req-8"
        name: "Identify Users and Authenticate Access to System Components"
      - id: "Req-9"
        name: "Restrict Physical Access to Cardholder Data"
      - id: "Req-10"
        name: "Log and Monitor All Access to System Components and Cardholder Data"
      - id: "Req-11"
        name: "Test Security of Systems and Networks Regularly"
      - id: "Req-12"
        name: "Support Information Security with Organizational Policies and Programs"

  iso27001:
    name: "ISO 27001:2022"
    description: "Information Security Management System"
    domains:
      - id: "A.5"
        name: "Organizational Controls"
        control_count: 37
      - id: "A.6"
        name: "People Controls"
        control_count: 8
      - id: "A.7"
        name: "Physical Controls"
        control_count: 14
      - id: "A.8"
        name: "Technological Controls"
        control_count: 34

  hipaa:
    name: "HIPAA Security Rule"
    description: "Health Insurance Portability and Accountability Act"
    safeguards:
      - id: "Administrative"
        controls: ["Risk Analysis", "Workforce Security", "Information Access Management", "Security Awareness Training", "Security Incident Procedures", "Contingency Plan"]
      - id: "Physical"
        controls: ["Facility Access Controls", "Workstation Security", "Device and Media Controls"]
      - id: "Technical"
        controls: ["Access Control", "Audit Controls", "Integrity Controls", "Transmission Security"]

  owasp:
    name: "OWASP ASVS v4.0"
    description: "Application Security Verification Standard"
    levels:
      - level: 1
        name: "Opportunistic"
        description: "Minimum for all applications"
      - level: 2
        name: "Standard"
        description: "For applications with sensitive data"
      - level: 3
        name: "Advanced"
        description: "For critical applications (medical, military, financial)"
