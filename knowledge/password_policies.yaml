# Password Security Knowledge Base
hash_types:
  md5:
    identifier: "$1$"
    name: "MD5"
    strength: weak
    crack_speed: "billions/sec on GPU"
    recommendation: "Do not use — trivially crackable"
  sha256:
    identifier: "$5$"
    name: "SHA-256 (crypt)"
    strength: weak
    crack_speed: "billions/sec on GPU"
    recommendation: "Do not use for passwords"
  sha512:
    identifier: "$6$"
    name: "SHA-512 (crypt)"
    strength: moderate
    crack_speed: "millions/sec on GPU"
    recommendation: "Acceptable for legacy; prefer bcrypt/scrypt/argon2"
  bcrypt:
    identifier: "$2b$"
    name: "bcrypt"
    strength: strong
    crack_speed: "thousands/sec on GPU"
    recommendation: "Good choice; use cost factor >= 12"
  scrypt:
    identifier: "$scrypt$"
    name: "scrypt"
    strength: strong
    crack_speed: "hundreds/sec (memory-hard)"
    recommendation: "Good choice; high memory cost"
  argon2:
    identifier: "$argon2id$"
    name: "Argon2id"
    strength: excellent
    crack_speed: "very slow (memory-hard + CPU-hard)"
    recommendation: "Best practice; use Argon2id variant"
  ntlm:
    identifier: null
    name: "NTLM"
    length: 32
    strength: weak
    crack_speed: "billions/sec on GPU"
    recommendation: "Windows legacy; crack or pass-the-hash"
  netlmv2:
    identifier: null
    name: "NetNTLMv2"
    strength: moderate
    recommendation: "Capture and relay or crack"

common_patterns:
  - pattern: "Season+Year"
    examples: ["Summer2024!", "Winter2023#", "Fall2024$"]
    frequency: "very common"
  - pattern: "Company+Numbers"
    examples: ["Company123!", "Acme2024!", "Corp@2024"]
    frequency: "very common"
  - pattern: "Keyboard walks"
    examples: ["qwerty123", "qazwsx", "1q2w3e4r"]
    frequency: "common"
  - pattern: "Month+Year"
    examples: ["January2024!", "March2024#"]
    frequency: "common"
  - pattern: "Name+Numbers"
    examples: ["John123!", "Admin@2024"]
    frequency: "common"

wordlist_sources:
  - name: "rockyou.txt"
    size: "14M passwords"
    description: "Classic leaked password database"
  - name: "SecLists"
    size: "Various"
    description: "Collection of security testing wordlists"
    url: "https://github.com/danielmiessler/SecLists"
  - name: "CrackStation"
    size: "1.5B entries"
    description: "Large wordlist from various breaches"

password_strength_rules:
  minimum_length: 12
  require_uppercase: true
  require_lowercase: true
  require_digits: true
  require_special: true
  max_age_days: 90
  min_age_days: 1
  history_count: 12
  lockout_threshold: 5
  lockout_duration_minutes: 30
